name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more of this form you fill in, the quicker the problem can be found.

        Please remove or blank out other players' names from anything you paste.

  - type: input
    id: version
    attributes:
      label: Version
      description: For a plugin, type `/xllog` in game and search for the plugin's name. Copy the line that ends in "loaded", or give the version shown in `/xlplugins`. For anything else, give the version or commit you used.
      placeholder: Plugin Name 0.1.1.0+803135d loaded
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw. Screenshots help.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can the problem be made to happen again? If it is about text in the game (chat, a listing, a name), paste an example.
      placeholder: |
        1. Open the settings window
        2. Turn on ...
        3. ... happens
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Only once so far

  - type: textarea
    id: other-plugins
    attributes:
      label: Other plugins
      description: List any plugins that might touch the same part of the game, such as ones that change chat, names, nameplates, the Party Finder or travel. Write "none" if there are none.

  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: Optional. Any lines from `/xllog` (or other logs) that mention the plugin or tool around the time of the problem, especially errors.
      render: text
