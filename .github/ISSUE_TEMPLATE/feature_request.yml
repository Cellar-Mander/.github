name: Feature request
description: Suggest a new feature or a change to an existing one.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature or change.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Which part does it relate to?
      description: Optional. The window, setting, command or feature it touches, or "something new".
